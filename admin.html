<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Portfólio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface-border: rgba(16, 19, 33, 0.08);
            --text: #10131c;
            --text-muted: #565f78;
            --grad-start: #7c5cff;
            --grad-end: #33b6ff;
            --shadow-lg: 0 24px 48px rgba(16, 19, 33, 0.08);
            --radius-lg: 22px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 34px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-lg);
        }
        .box.box-wide { max-width: 480px; }
        form { display: flex; flex-direction: column; gap: 14px; }
        input, textarea {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--surface-border);
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus, textarea:focus { border-color: var(--grad-start); }
        button {
            padding: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
            border: none;
            font-weight: 600;
            border-radius: 999px;
            font-size: 15px;
            color: #fff;
            font-family: "Inter", sans-serif;
            box-shadow: 0 10px 20px rgba(124, 92, 255, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 14px 24px rgba(124, 92, 255, 0.35); }
        .hidden { display: none !important; }
        h1 {
            margin-bottom: 22px;
            font-size: 22px;
            font-weight: 700;
            font-family: "Space Grotesk", sans-serif;
            text-align: center;
        }
        .logout-btn {
            background: #fff;
            color: #d94f4f;
            border: 1px solid rgba(217, 79, 79, 0.3);
            box-shadow: none;
            margin-bottom: 15px;
        }
        .logout-btn:hover { background: rgba(217, 79, 79, 0.08); transform: none; box-shadow: none; }

        /* Estilo para o botão Voltar */
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            background: transparent;
            color: var(--text-muted);
            padding: 10px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s ease;
        }
        .back-btn:hover { color: var(--text); }

        /* Lista de projetos cadastrados */
        .section-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin: 26px 0 12px;
            color: var(--text);
        }
        .lista-projetos {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .lista-projetos .item-projeto {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            background: var(--bg);
        }
        .lista-projetos .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .lista-projetos img {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: var(--surface-border);
        }
        .lista-projetos .item-titulo {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-remover {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #d94f4f;
            border: 1px solid rgba(217, 79, 79, 0.3);
            box-shadow: none;
            border-radius: 8px;
            font-size: 13px;
        }
        .btn-remover:hover {
            background: #d94f4f;
            color: #fff;
            transform: none;
            box-shadow: none;
        }
        .lista-vazia,
        .lista-carregando {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 16px 0;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="box" id="tela-login">
        <h1>Login Admin</h1>
        <form id="form-login">
            <input type="email" id="email-admin" placeholder="Seu e-mail" required>
            <input type="password" id="senha-admin" placeholder="Sua senha" required>
            <button type="submit">Entrar</button>
        </form>
        <!-- Botão para voltar ao site principal -->
        <a href="index.html" class="back-btn">← Voltar para o Main</a>
    </div>

    <!-- PAINEL DE CADASTRO -->
    <div class="box box-wide hidden" id="painel-admin">
        <h1>Adicionar Projeto</h1>
        <button type="button" class="logout-btn" id="btn-sair">Sair da Conta</button>
        <form id="form-projeto">
            <input type="text" id="titulo" placeholder="Título do Projeto" required>
            <textarea id="descricao" placeholder="Descrição curta" required></textarea>
            <input type="url" id="linkImagem" placeholder="URL Direta da Imagem (ex: ImgBB)" required>
            <input type="url" id="linkProjeto" placeholder="Link do GitHub ou Site" required>
            <button type="submit">Salvar no Firebase</button>
        </form>

        <h2 class="section-title">Projetos Cadastrados</h2>
        <ul class="lista-projetos" id="lista-projetos">
            <li class="lista-carregando">Carregando projetos...</li>
        </ul>

        <a href="index.html" class="back-btn">← Voltar para o Main</a>
    </div>

    <!-- Script de Autenticação e Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-vaw2QpHagdjyKPyH0cXxbmLswal86Uo",
            authDomain: "portfolio-e179c.firebaseapp.com",
            projectId: "portfolio-e179c",
            storageBucket: "portfolio-e179c.firebasestorage.app",
            messagingSenderId: "1047860770726",
            appId: "1:1047860770726:web:6afd51307c7b050b4f4167",
            measurementId: "G-MQ6ZHL106E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const telaLogin = document.getElementById('tela-login');
        const painelAdmin = document.getElementById('painel-admin');
        const formLogin = document.getElementById('form-login');
        const formProjeto = document.getElementById('form-projeto');
        const btnSair = document.getElementById('btn-sair');
        const listaProjetos = document.getElementById('lista-projetos');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-admin').value;
            const senha = document.getElementById('senha-admin').value;

            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (erro) {
                console.error("Erro no login: ", erro);
                alert("E-mail ou senha incorretos, ou autenticação não ativada no Firebase.");
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                telaLogin.classList.add('hidden');
                painelAdmin.classList.remove('hidden');
                carregarListaProjetos();
            } else {
                telaLogin.classList.remove('hidden');
                painelAdmin.classList.add('hidden');
            }
        });

        btnSair.addEventListener('click', async () => {
            await signOut(auth);
        });

        async function carregarListaProjetos() {
            listaProjetos.innerHTML = '<li class="lista-carregando">Carregando projetos...</li>';

            try {
                const querySnapshot = await getDocs(collection(db, "projetos"));

                if (querySnapshot.empty) {
                    listaProjetos.innerHTML = '<li class="lista-vazia">Nenhum projeto cadastrado ainda.</li>';
                    return;
                }

                listaProjetos.innerHTML = '';

                querySnapshot.forEach((docSnap) => {
                    const projeto = docSnap.data();
                    const li = document.createElement('li');
                    li.className = 'item-projeto';
                    li.innerHTML = `
                        <div class="item-info">
                            <img src="${projeto.linkImagem}" alt="">
                            <span class="item-titulo">${projeto.titulo}</span>
                        </div>
                        <button type="button" class="btn-remover" data-id="${docSnap.id}" title="Remover projeto">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    listaProjetos.appendChild(li);
                });
            } catch (erro) {
                console.error("Erro ao listar projetos: ", erro);
                listaProjetos.innerHTML = '<li class="lista-vazia">Erro ao carregar a lista de projetos.</li>';
            }
        }

        listaProjetos.addEventListener('click', async (e) => {
            const btn = e.target.closest('.btn-remover');
            if (!btn) return;

            const id = btn.dataset.id;
            const confirmar = confirm("Tem certeza que deseja remover este projeto? Essa ação não pode ser desfeita.");
            if (!confirmar) return;

            btn.disabled = true;

            try {
                await deleteDoc(doc(db, "projetos", id));
                await carregarListaProjetos();
            } catch (erro) {
                console.error("Erro ao remover projeto: ", erro);
                alert("Ocorreu um erro ao remover o projeto.");
                btn.disabled = false;
            }
        });

        formProjeto.addEventListener('submit', async (e) => {
            e.preventDefault();

            const titulo = document.getElementById('titulo').value;
            const descricao = document.getElementById('descricao').value;
            const linkImagem = document.getElementById('linkImagem').value;
            const linkProjeto = document.getElementById('linkProjeto').value;

            try {
                const docRef = await addDoc(collection(db, "projetos"), {
                    titulo: titulo,
                    descricao: descricao,
                    linkImagem: linkImagem,
                    linkProjeto: linkProjeto
                });
                alert("Sucesso! Projeto salvo com ID: " + docRef.id);
                formProjeto.reset();
                await carregarListaProjetos();
            } catch (erro) {
                console.error("Erro ao salvar: ", erro);
                alert("Ocorreu um erro ao salvar o projeto.");
            }
        });
    </script>
</body>
</html>
